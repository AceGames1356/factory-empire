<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1f52">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lilita+One&display=swap">
<title>Factory Empire</title>
<style>
:root{--bg:#eef2fa;--card:#fff;--ink:#22304a;--mut:#7a869e;--pri:#5b5bf0;--pri2:#9b59f6;--good:#1fbf75;--gold:#f7b500;--line:#e3e8f3;--bad:#ef476f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;border:none}
h2{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);display:flex;align-items:center;gap:8px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 4px 18px rgba(80,60,200,.25)}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.05;letter-spacing:.04em}
.brand .logo{font-size:30px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.brand b{font-size:17px}
.money{flex:1;text-align:center}
#money{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .1s}
#money.pop{transform:scale(1.06)}
#ips{font-size:13px;opacity:.92;font-weight:600}
.hbtns{display:flex;gap:6px}
.hbtns button{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.2);color:#fff;font-size:17px;font-weight:800}
.hbtns button:active{background:rgba(255,255,255,.35)}
#layout{display:grid;grid-template-columns:280px minmax(0,1fr) 330px;gap:14px;padding:14px;max-width:1500px;margin:0 auto}
.panel{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(30,40,90,.06)}
#listPanel,#sidePanel{align-self:start;position:sticky;top:76px;max-height:calc(100vh - 90px);overflow:auto}
#sidePanel{display:flex;flex-direction:column;gap:14px;background:none;padding:0;box-shadow:none}
/* factory list */
.fc{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;border:2px solid var(--line);margin-bottom:8px;cursor:pointer;transition:transform .1s,border-color .2s,background .2s;position:relative}
.fc:active{transform:scale(.98)}
.fc.sel{border-color:var(--pri);background:#f3f2ff}
.fc.locked{opacity:.55;cursor:default}
.fc.buildable{border-style:dashed;cursor:default}
.fc.canbuild{border-color:var(--good);background:#effbf5;animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(31,191,117,.15)}}
.fi{width:44px;height:44px;flex:0 0 44px;border-radius:12px;display:grid;place-items:center;font-size:24px}
.fb{flex:1;min-width:0}
.fn{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs{font-size:12px;color:var(--mut);margin:2px 0 5px}
.build{width:100%;padding:7px;border-radius:10px;background:var(--good);color:#fff;font-weight:700;font-size:13px}
.build:disabled{background:#c5ccdb;cursor:not-allowed}
.bar{height:7px;background:#e5e9f4;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--good));border-radius:6px;transition:width .3s}
/* main */
#mainPanel{display:flex;flex-direction:column;gap:12px;min-width:0}
#fhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#fhead .fi{width:50px;height:50px;font-size:28px}
#fhead .t{flex:1;min-width:160px}
#fhead .t b{font-size:19px}
#fhead .t div{font-size:13px;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:5px 9px;border-radius:999px;background:#f0f3fa;color:var(--ink);white-space:nowrap}
.chip.warn{background:#fff3dc;color:#9a6200}
.chip.ok{background:#e4f8ee;color:#137a4a}
#sceneWrap{position:relative;border-radius:14px;overflow:hidden;background:#10143a;touch-action:manipulation}
#scene{display:block;width:100%;cursor:pointer}
.tapHint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(20,25,45,.65);color:#fff;font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;pointer-events:none;transition:opacity .5s;white-space:nowrap;max-width:94%;z-index:2}
#goals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal{background:#f6f7fd;border-radius:12px;padding:9px 11px;font-size:13px}
.goal .gt{display:flex;justify-content:space-between;gap:6px;margin-bottom:6px;font-weight:600}
.goal .gt span:last-child{color:var(--mut);font-weight:600;white-space:nowrap}
.buyRow{display:flex;align-items:center;gap:6px;justify-content:space-between;flex-wrap:wrap}
.buyRow .lbl{font-weight:700;font-size:14px}
.seg{display:flex;background:#eef1f8;border-radius:12px;padding:3px}
.seg button{padding:6px 12px;border-radius:9px;background:none;font-weight:700;color:var(--mut);font-size:13px}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.1)}
#upgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.upg{position:relative;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:10px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;transition:transform .08s,border-color .2s,box-shadow .2s;color:var(--ink)}
.upg:active{transform:scale(.97)}
.upg .ui{width:42px;height:42px;border-radius:12px;background:#f0f3fa;display:grid;place-items:center;font-size:22px}
.upg b{font-size:14px;display:block}
.upg .lv{font-size:12px;font-weight:700;color:var(--pri)}
.upg small{display:block;font-size:11.5px;color:var(--mut);margin-top:2px}
.upg .uc{text-align:right}
.upg .cost{display:block;font-weight:800;font-size:14px;padding:6px 9px;border-radius:9px;background:#eef1f8;white-space:nowrap}
.upg .gain{display:block;font-size:11.5px;color:var(--good);font-weight:700;margin-top:4px;white-space:nowrap}
.upg.can{border-color:#bfe9d3}
.upg.can .cost{background:var(--good);color:#fff}
.upg.cant{opacity:.62}
.upg .badge{position:absolute;top:-8px;right:10px;background:var(--gold);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;display:none;letter-spacing:.04em}
.upg.best .badge{display:block}
.upg.flash{animation:flash .4s}
@keyframes flash{30%{box-shadow:0 0 0 5px rgba(31,191,117,.35)}}
.upg.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* stats */
.srow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;gap:8px}
.srow span:last-child{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.ftable{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.ftable td,.ftable th{padding:5px 3px;text-align:right;border-bottom:1px solid var(--line)}
.ftable th{color:var(--mut);font-weight:600}
.ftable td:first-child,.ftable th:first-child{text-align:left}
.danger{margin-top:14px;width:100%;padding:9px;border-radius:10px;background:#fdecef;color:var(--bad);font-weight:700}
/* achievements */
#achs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach{display:flex;gap:8px;align-items:center;padding:8px;border-radius:12px;background:#f5f6fb;font-size:12px;opacity:.5}
.ach.got{opacity:1;background:linear-gradient(135deg,#fff8e1,#fff1c4)}
.ach .ai{font-size:22px}
.ach b{display:block;font-size:12.5px}
.ach span{color:var(--mut);font-size:11px}
.count{background:var(--pri);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px;letter-spacing:0}
/* nav */
#bnav{display:none}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,24,45,.55);display:grid;place-items:center;z-index:50;padding:16px}
#modal.hidden{display:none}
.mbox{background:#fff;border-radius:22px;padding:22px;max-width:420px;width:100%;max-height:88vh;overflow:auto;text-align:center;animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.mbox .big{font-size:52px;line-height:1}
.mbox h3{margin:8px 0 4px;font-size:22px}
.mbox p{color:var(--mut);margin:6px 0;font-size:14px;line-height:1.45}
.mbox .earn{font-size:30px;font-weight:800;color:var(--good);margin:8px 0}
.mbox .rows{text-align:left;margin:12px 0;background:#f6f7fd;border-radius:12px;padding:6px 12px}
.mbox .rows div{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line);gap:8px}
.mbox .rows div:last-child{border:none}
.mbox ul{text-align:left;font-size:14px;line-height:1.5;padding-left:20px;color:var(--ink)}
.mbtns{display:flex;gap:8px;margin-top:14px}
.mbtns button{flex:1;padding:12px;border-radius:12px;font-weight:800;font-size:15px;background:var(--pri);color:#fff}
.mbtns button.sec{background:#eef1f8;color:var(--ink)}
.mbtns button.red{background:var(--bad)}
#toasts{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:#22304a;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .35s ease-out}
.toast.gold{background:linear-gradient(135deg,#f7b500,#ff8c42)}
.toast.green{background:linear-gradient(135deg,#1fbf75,#13a3a0)}
.toast.out{opacity:0;transform:translateY(-10px);transition:.4s}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}}
/* responsive */
@media (max-width:1150px){#layout{grid-template-columns:250px minmax(0,1fr)}#sidePanel{grid-column:1/-1;position:static;max-height:none;display:grid;grid-template-columns:1fr 1fr}}
@media (max-width:760px){
 header{padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
 .brand .bt{display:none}
 #money{font-size:26px}
 #layout{display:block;padding:10px 10px calc(78px + env(safe-area-inset-bottom))}
 .panel{display:none}
 #sidePanel{display:block;position:static;max-height:none}
 #listPanel{position:static;max-height:none}
 body[data-view=factory] .panel[data-v=factory],body[data-view=list] .panel[data-v=list],body[data-view=stats] .panel[data-v=stats],body[data-view=awards] .panel[data-v=awards]{display:flex;flex-direction:column}
 body[data-view=list] #listPanel,body[data-view=stats] [data-v=stats],body[data-view=awards] [data-v=awards]{display:block}
 #upgs{grid-template-columns:1fr}
 #goals{grid-template-columns:1fr}
 .panel{padding:12px}
 #bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;box-shadow:0 -4px 18px rgba(30,40,90,.1);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 #bnav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:20px;padding:5px 0;border-radius:12px;color:var(--mut);position:relative}
 #bnav button span{font-size:11px;font-weight:700}
 #bnav button.on{color:var(--pri);background:#f1f0ff}
 #bnav .dot{position:absolute;top:3px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--bad);display:none}
 #bnav .dot.show{display:block}
 #achs{grid-template-columns:1fr}
 #bnav{z-index:45}
 #sheetBg{display:none;position:fixed;inset:0;z-index:35;background:transparent}
 body[data-sheet=stats] #sheetBg,body[data-sheet=awards] #sheetBg,body[data-sheet=prestige] #sheetBg{display:block}
 body[data-sheet=stats] .panel[data-v=stats],body[data-sheet=awards] .panel[data-v=awards],body[data-sheet=prestige] .panel[data-v=prestige]{display:block;position:fixed;left:8px;right:8px;bottom:calc(74px + env(safe-area-inset-bottom));max-height:66vh;overflow:auto;z-index:40;border-radius:22px;padding:18px 14px 14px;box-shadow:0 -10px 40px rgba(20,24,60,.35);animation:sheetUp .25s ease-out}
 body[data-sheet=stats] .panel[data-v=stats]::before,body[data-sheet=awards] .panel[data-v=awards]::before,body[data-sheet=prestige] .panel[data-v=prestige]::before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:#d5dbe8;margin:-8px auto 12px}
}
@keyframes sheetUp{from{transform:translateY(30px);opacity:0}}
#live{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}
#live::-webkit-scrollbar{display:none}
.lvc{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:#f3f5fb;border-radius:12px;padding:5px 10px 7px;font-size:12px;font-weight:700;position:relative;overflow:hidden;cursor:pointer}
.lvc b{font-variant-numeric:tabular-nums;color:var(--good)}
.lvc i{position:absolute;left:0;bottom:0;height:3px;width:40%;background:linear-gradient(90deg,transparent,var(--good),transparent);animation:lvrun 1.4s linear infinite}
@keyframes lvrun{from{left:-40%}to{left:100%}}
.lvc .ic{font-size:17px}
/* polish */
body{background:radial-gradient(1200px 500px at 50% -100px,#dfe6ff,var(--bg) 60%) fixed;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.panel{border:1px solid rgba(91,91,240,.08);box-shadow:0 6px 24px rgba(30,40,90,.08),0 1px 2px rgba(30,40,90,.06)}
header{box-shadow:0 6px 24px rgba(80,60,200,.35)}
#live{background:rgba(255,255,255,.85);backdrop-filter:blur(8px)}
.fc,.upg,.goal,.ach{transition:transform .12s,box-shadow .2s,border-color .2s}
.fc.sel{box-shadow:0 4px 14px rgba(91,91,240,.2)}
.upg{box-shadow:0 2px 8px rgba(30,40,90,.06)}
.upg.can{box-shadow:0 4px 14px rgba(31,191,117,.22);background:linear-gradient(180deg,#fff,#f2fcf7)}
.upg.can .cost{box-shadow:0 3px 0 #15965a}
.upg.can:active .cost{box-shadow:none;transform:translateY(2px)}
.goal{border:1px solid var(--line)}
#sceneWrap{box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 6px 18px rgba(30,40,90,.15)}
button{touch-action:manipulation}
svg.ic{width:1.1em;height:1.1em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fi svg.ic,.upg .ui svg.ic{width:1.15em;height:1.15em;vertical-align:middle}
.big svg.ic{width:1em;height:1em;stroke-width:1.6;color:var(--pri)}
h2 svg.ic{color:var(--pri);width:1.2em;height:1.2em}
.hbtns svg.ic{width:20px;height:20px;vertical-align:middle}
.brand .logo svg.ic{width:1em;height:1em;stroke-width:1.8}
.ach .ai svg.ic{width:1.2em;height:1.2em}
.ach.got .ai{color:#d48f00}
.upg .ui{color:var(--pri)}
.chip svg.ic{width:1em;height:1em;vertical-align:-.15em}
#bnav button svg.ic{width:22px;height:22px;vertical-align:middle}
.lvc .ic svg.ic{width:1em;height:1em;vertical-align:middle;color:var(--pri)}
.mbox .mbtns{position:sticky;bottom:-22px;background:#fff;padding:10px 0 2px;margin-top:6px}
/* ===== GAME SKIN ===== */
:root{--bg:#0f1330;--card:#1d2342;--ink:#eef1ff;--mut:#9aa6cf;--line:#2c3562;--pri:#7a70ff;--good:#2fe08a;--gold:#ffc83d;--bad:#ff5a7a;--hd:'Lilita One','Fredoka',system-ui,sans-serif}
body{font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:500;color:var(--ink);background:radial-gradient(900px 420px at 50% -100px,#4338b5aa,transparent),repeating-linear-gradient(45deg,#11163a 0 16px,#131944 16px 32px) fixed}
h2,h3,.fn,.t b,.upg b,.mbtns button,.build,.seg button,#bnav span,.badge,.count,.brand,.goal .gt,.chip{font-family:var(--hd);font-weight:400;letter-spacing:.02em}
h2{color:#b9c4ff}
header{background:linear-gradient(#2c3278,#1a1f52);border-bottom:4px solid #0a0d26;box-shadow:0 5px 0 #0a0d2666}
.money{background:#0a0d2699;border:3px solid #0a0d26;box-shadow:inset 0 0 0 2px #ffc83d44;border-radius:18px;padding:3px 12px;flex:1;max-width:360px;margin:0 auto}
#money{font-family:var(--hd);font-weight:400;color:#ffd54a;text-shadow:0 3px 0 #a86a00,0 6px 10px #0008;letter-spacing:.03em}
#ips{color:#5dffa8;font-family:var(--hd);font-weight:400}
.hbtns button{background:#0f1431;border:3px solid #4c58b8;border-bottom-width:5px;color:#dfe4ff;border-radius:12px}
.hbtns button:active{transform:translateY(2px);border-bottom-width:3px}
#live{background:#0d1130e6;border-bottom:3px solid #0a0d26;backdrop-filter:none}
.lvc{background:#1b2147;border:2px solid #323c7a;color:var(--ink);font-family:var(--hd);font-weight:400}
.lvc b{color:#5dffa8}
.panel{background:linear-gradient(#242b58,#1b2148);border:3px solid #3a4590;border-bottom-width:6px;border-radius:20px;box-shadow:0 8px 0 #0a0d26aa,0 14px 24px #0006;color:var(--ink)}
.fc{background:#151a3f;border:3px solid #2c3562;border-bottom-width:6px;border-radius:16px}
.fc.sel{background:#2c3278;border-color:#ffc83d;box-shadow:0 0 0 3px #ffc83d33}
.fc.canbuild{background:#14382f;border-color:var(--good)}
.fc.locked{opacity:.55}
.fc.locked .fi{background:#0c1030!important}
.fs{color:var(--mut)}
.bar{height:11px;background:#080b22;border:2px solid #000;border-radius:8px;box-shadow:inset 0 2px 3px #0008}
.bar i{background:linear-gradient(#8bffc0,#1fbf75 55%,#14a05f);border-radius:5px}
.build{background:linear-gradient(#6dffb2,#1fbf75);color:#06301c;border-bottom:4px solid #0f7a46;border-radius:12px;font-size:14px}
.build:active{transform:translateY(2px);border-bottom-width:2px}
.build:disabled{background:#3a4170;color:#8e98d6;border-bottom-color:#272d58}
.chip{background:#0d1130;border:2px solid #2c3562;color:var(--ink)}
.chip.warn{background:#4a3510;color:#ffcf6b;border-color:#8a6a1e}
.chip.ok{background:#0f3b2a;color:#5dffa8;border-color:#1f7a52}
#sceneWrap{border:4px solid #0a0d26;border-radius:16px;box-shadow:0 0 0 3px #4c58b8,0 8px 0 #0a0d26}
.goal{background:#12173b;border:2px solid #2c3562;color:var(--ink)}
.goal .gt span:last-child{color:var(--mut)}
.seg{background:#080b22;border:2px solid #000;border-radius:14px}
.seg button{color:var(--mut)}
.seg button.on{background:linear-gradient(#ffd54a,#ffb300);color:#3a2500;box-shadow:0 3px 0 #a86a00}
.upg{background:#1a2050;border:3px solid #2c3562;border-bottom-width:6px;border-radius:16px;color:var(--ink);box-shadow:none}
.upg:active{transform:translateY(3px);border-bottom-width:3px}
.upg .ui{background:#0c1030;color:#9a92ff;border:2px solid #2c3562}
.upg small{color:var(--mut)}
.upg .lv{color:#ffd54a;font-family:var(--hd);font-weight:400}
.upg .cost{background:#0c1030;color:var(--mut);border:2px solid #2c3562;font-family:var(--hd);font-weight:400}
.upg.can{background:linear-gradient(#1f3d4f,#183040);border-color:#2fe08a;box-shadow:0 0 14px #2fe08a33}
.upg.can .cost{background:linear-gradient(#6dffb2,#1fbf75);color:#06301c;border:none;box-shadow:0 4px 0 #0f7a46}
.upg.can:active .cost{box-shadow:none;transform:translateY(2px)}
.upg.cant{opacity:.6}
.upg .gain{color:#5dffa8}
.upg .badge{background:linear-gradient(#ffd54a,#ffb300);color:#3a2500;border:2px solid #a86a00}
.srow{border-bottom-color:#2c3562}
.ftable td,.ftable th{border-bottom-color:#2c3562}
.ach{background:#12173b;border:2px solid #2c3562}
.ach.got{background:linear-gradient(135deg,#4d3c0c,#2f2a14);border-color:#ffc83d99}
.ach.got .ai{color:#ffd54a}
.count{background:linear-gradient(#ffd54a,#ffb300);color:#3a2500}
.danger{background:#4a1a2c;color:#ff8aa5;border:2px solid #7a2a45;font-family:var(--hd);font-weight:400}
.mbox{background:linear-gradient(#262d5c,#1b2148);border:4px solid #4c58b8;border-bottom-width:7px;color:var(--ink)}
.mbox p{color:var(--mut)}
.mbox .rows{background:#0f1431;border:2px solid #2c3562}
.mbox .earn{color:#ffd54a;text-shadow:0 3px 0 #a86a00;font-family:var(--hd);font-weight:400}
.mbox .big svg.ic{color:#ffd54a}
.mbox .mbtns{background:#1b2148}
.mbtns button{background:linear-gradient(#ffd54a,#ffb300);color:#3a2500;border-bottom:5px solid #a86a00;border-radius:14px}
.mbtns button:active{transform:translateY(3px);border-bottom-width:2px}
.mbtns button.sec{background:#2c3562;color:var(--ink);border-bottom-color:#1a2050}
.mbtns button.red{background:linear-gradient(#ff7d97,#ff4468);color:#fff;border-bottom-color:#a02040}
.toast{background:#11163a;border:2px solid #4c58b8;font-family:var(--hd);font-weight:400}
.toast.gold{background:linear-gradient(#ffd54a,#ffa31a);color:#3a2500;border-color:#a86a00}
.toast.green{background:linear-gradient(#5dffa8,#1fbf75);color:#06301c;border-color:#0f7a46}
#bnav{background:#0d1130;border-top:4px solid #0a0d26;box-shadow:0 -3px 0 #3a4590}
#bnav button{color:#8e98d6}
#bnav button.on{background:#2c3278;color:#ffd54a;box-shadow:0 3px 0 #0a0d26}
h2 svg.ic{color:#ffd54a}
.brand .logo{color:#ffd54a}
@media (min-width:761px) and (max-width:1150px){#listPanel{grid-row:1/span 2}#mainPanel{grid-column:2;grid-row:1}#sidePanel{grid-column:2;grid-row:2}}

#crate{position:absolute;left:-70px;width:56px;height:56px;z-index:6;cursor:pointer;filter:drop-shadow(0 0 12px #ffc83d);animation:crateFly 9s linear forwards,crateBob .7s ease-in-out infinite alternate;touch-action:manipulation}
#crate svg{width:100%;height:100%;display:block}
@keyframes crateFly{to{left:calc(100% + 10px)}}
@keyframes crateBob{from{margin-top:-8px}to{margin-top:8px}}
#sceneWrap.frenzy{box-shadow:0 0 0 3px #ffc83d,0 0 28px #ffc83d99,0 8px 0 #0a0d26;animation:fzp 1s ease-in-out infinite alternate}
@keyframes fzp{to{box-shadow:0 0 0 3px #fff2a8,0 0 40px #ffc83dcc,0 8px 0 #0a0d26}}
.fz{display:inline-block;background:linear-gradient(#ffd54a,#ffb300);color:#3a2500;border-radius:8px;padding:0 6px;margin-left:4px;font-size:.8em}
.fgold{display:flex;gap:10px;margin-bottom:10px}.fgold>div{flex:1;background:#0d1130;border:2px solid #2c3562;border-radius:14px;padding:8px 12px}
.fgold small{display:block;color:var(--mut);font-size:12px}.fgold b{font-family:var(--hd);font-weight:400;font-size:24px;color:#ffd54a}
.fbox{background:#12173b;border:2px solid #2c3562;border-radius:14px;padding:10px 12px;margin-bottom:12px}
.fbox .ft{font-family:var(--hd);margin-bottom:6px}.fbox .fs{margin:6px 0 8px;font-size:13px}.fbox .build{width:100%;padding:10px}
.fperks{display:flex;flex-direction:column;gap:8px}.perk{cursor:pointer}.perk .ui svg.ic{color:#ffd54a}
.perk .cost svg.ic{color:#ffd54a}
@media (max-width:760px){#mainPanel{display:none}body[data-view=factory] #mainPanel{display:flex}}

.panel{box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 8px 0 #0a0d26aa,0 14px 24px #0006}
.build,.mbtns button,.seg button.on{box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.mbtns button.sec{box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
.upg.can .cost{box-shadow:0 4px 0 #0f7a46,inset 0 2px 0 rgba(255,255,255,.55)}
.upg.can{position:relative;overflow:hidden}
.upg.can::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);animation:shine 3.2s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,60%{left:-80px}100%{left:110%}}
.fc{transition:transform .12s,background .2s}.fc:active{transform:scale(.985)}
.fc.sel .fi,.fc.canbuild .fi{box-shadow:0 0 14px currentColor}
header::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;background:linear-gradient(90deg,transparent,#ffc83d88,transparent)}
header{position:sticky}
#money{transition:transform .15s}
.hbtns button,#bnav button{transition:transform .1s,background .2s}
#bnav button:active{transform:scale(.94)}
.ach.got{box-shadow:0 0 16px #ffc83d33}
.bar i{box-shadow:0 0 10px #2fe08a88}
.goal .bar i{position:relative}
.chip{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
</style>

<header>
  <div class="brand"><span class="logo">🏭</span><span class="bt">FACTORY<br><b>EMPIRE</b></span></div>
  <div class="money"><div id="money">$0</div><div id="ips">+$0/s</div></div>
  <div class="hbtns"><button id="soundBtn" title="Sound">🔊</button><button id="helpBtn" title="How to play">?</button></div>
</header>
<div id="live"></div>
<div id="sheetBg"></div>
<main id="layout">

    <div class="panel" data-v="prestige"><h2>🥇 Franchise</h2><div id="fran"></div></div>
    <div class="panel" data-v="awards"><h2>🏆 Achievements <span class="count" id="achCount">0</span></h2><div id="achs"></div></div>
  </section>
</main>
<nav id="bnav">
  <button data-view="factory" class="on">🏭<span>Factory</span></button>
  <button data-view="list">🗺️<span>Empire</span><i class="dot" id="dotList"></i></button>

function newState(){return{v:1,money:5,lifetime:0,items:0,taps:0,sel:0,buy:1,

function loadState(){
 let raw=null;try{raw=localStorage.getItem(SAVE_KEY)}catch(e){}
 if(!raw)return {s:newState(),existed:false};
 try{
  const p=JSON.parse(raw),d=newState();
  for(const k of ['money','lifetime','items','taps','lastTick','start','playTime','offlineEarned','offlineCount','upgrades','best','gold','goldTotal','run','runs','crates','frenzy'])d[k]=Math.max(0,num(p[k],d[k]));
  d.sel=num(p.sel,0)|0;d.buy=(p.buy==='max'||[1,10,25].includes(p.buy))?p.buy:1;
  d.perks=[0,1,2,3,4].map(k=>Math.max(0,Math.min(PERKS[k].max,num(p.perks&&p.perks[k],0)|0)));d.won=!!p.won;d.sound=p.sound!==false;d.helped=!!p.helped;d.ach=(p.ach&&typeof p.ach==='object')?p.ach:{};
  d.factories=FACTORIES.map((f,i)=>{const q=(p.factories&&p.factories[i])||{};return{built:i===0||!!q.built,lv:[0,1,2,3].map(u=>Math.max(0,num(q.lv&&q.lv[u],0)|0)),items:num(q.items,0),earned:num(q.earned,0)}});
  if(!d.factories[d.sel]||!d.factories[d.sel].built)d.sel=0;

 }catch(e){return {s:newState(),existed:false}}

function milMult(t){let m=1;for(const x of MILESTONES)if(t>=x)m*=2;return m}
function smin(a,b){return Math.pow(Math.pow(a,-SMOOTH)+Math.pow(b,-SMOOTH),-1/SMOOTH)}
function stats(i,lv){
 lv=lv||S.factories[i].lv;const t=sumLv(lv),m=milMult(t);
 const p=BASE_RATE*(1+0.25*lv[0])*m, s=BASE_RATE*(1+0.3*lv[1])*(1+0.2*lv[2])*m;
 const r=smin(p,s), v=FACTORIES[i].value*(1+0.25*lv[3]);
 return {p,s,r,v,m,t,inc:r*v*gMult()};
}

function buyInfo(i,u,mode){
 const f=S.factories[i],up=UPG[u],c0=up.base*costMult(i)*Math.pow(up.g,f.lv[u]);
 mode=mode||S.buy;let n;
 if(mode==='max'){n=Math.floor(Math.log(S.money*(up.g-1)/c0+1)/Math.log(up.g));if(!(n>=1))n=1;}else n=mode;
 const cost=c0*(Math.pow(up.g,n)-1)/(up.g-1);
 return {n,cost,can:S.money>=cost*0.999999};
}

// ================= FORMAT =================
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){
 if(!isFinite(n))return '∞';if(n<0)return '-'+fmt(-n);
 if(n<1000){if(n<10&&n%1)return n.toFixed(2);if(n<100&&n%1)return n.toFixed(1);return Math.floor(n).toString()}
 let e=Math.floor(Math.log10(n)/3),v=n/Math.pow(1000,e);
 if(v>=999.5){e++;v/=1000}
 if(e>=SUF.length)return n.toExponential(2);
 return (v<10?v.toFixed(2):v<100?v.toFixed(1):v.toFixed(0))+SUF[e];
}
const $=n=>'$'+fmt(n);
const fmtN=n=>fmt(Math.floor(n+1e-9));
function fmtTime(s){s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;if(h)return h+'h '+m+'m';if(m)return m+'m '+x+'s';return x+'s'}

let AC=null;
function beep(f,d,type,vol,slide){
 if(!S.sound)return;
 try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(vol||0.06,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02)}catch(e){}
}

function doOffline(sec){
 const capped=Math.min(sec,offlineCap());let total=0;const rows=[];
 S.factories.forEach((f,i)=>{if(!f.built)return;const st=stats(i);const m=st.inc*capped,it=st.r*capped;
  f.items+=it;f.earned+=m;total+=m;S.items+=it;rows.push({i,m,it})});
 S.money+=total;S.lifetime+=total;S.run+=total;S.offlineEarned+=total;S.playTime+=0;
 if(total<=0)return;
 S.offlineCount++;
 if(offAgg&&modalOpen&&modalOpen.type==='offline'){offAgg.sec+=sec;offAgg.capped+=capped;offAgg.total+=total;
  rows.forEach(r=>{const o=offAgg.rows.find(x=>x.i===r.i);if(o){o.m+=r.m;o.it+=r.it}else offAgg.rows.push(r)});renderModal();return}

 showModal({type:'offline',html:()=>'<div class="big">🌙</div><h3>Welcome back, boss!</h3><p>You were away for <b>'+fmtTime(offAgg.sec)+'</b>'+(offAgg.sec>offlineCap()+1?' — your factories worked the maximum <b>'+(offlineCap()/3600)+'h</b> shift.':'. Your factories kept working!')+'</p><div class="earn">+'+$(offAgg.total)+'</div><div class="rows">'+offAgg.rows.map(r=>'<div><span>'+FACTORIES[r.i].icon+' '+FACTORIES[r.i].name+'</span><span>'+fmtN(r.it)+' '+FACTORIES[r.i].product.toLowerCase()+' · <b>'+$(r.m)+'</b></span></div>').join('')+'</div>',
  buttons:[{label:'💰 Collect',fn:()=>{sfx.coin();coinBurst(W/2,140,30);offAgg=null}}]});

 const st=stats(scene.idx),bonus=Math.max(1,st.inc*0.25);
 S.money+=bonus;S.lifetime+=bonus;S.run+=bonus;S.taps++;
 addFloat(x,y-6,'+'+$(bonus),'#ffe066',18);addPart(x,y,'#ffd166',8,160,4);
 const n=1+Math.min(3,tier(S.factories[scene.idx].lv[0]));spawnItem(n);
 sfx.tap();if(S.taps>=5)el('tapHint').style.opacity=0;
 const m=el('money');m.classList.add('pop');setTimeout(()=>m.classList.remove('pop'),100);
});

// ================= EVENTS =================
document.querySelectorAll('#buySeg button').forEach(b=>b.addEventListener('click',()=>{S.buy=b.dataset.b==='max'?'max':+b.dataset.b;updateUI()}));
document.querySelectorAll('#bnav button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
el('sheetBg').addEventListener('click',()=>setView(document.body.dataset.sheet));
el('soundBtn').onclick=()=>{S.sound=!S.sound;el('soundBtn').innerHTML=S.sound?'🔊':'🔇';if(S.sound)sfx.buy()};
el('soundBtn').innerHTML=S.sound?'🔊':'🔇';
function help(){showModal({html:()=>'<div class="big">🏭</div><h3>Welcome to Factory Empire</h3><p>Build an industrial empire from a tiny bolt workshop!</p><ul><li><b>Factories earn money automatically</b> — even while the game is closed (up to 8 hours).</li><li><b>⚙️ Speed</b> makes more items; <b>📦 Storage</b> and <b>👷 Workers</b> ship them faster. Output is limited by the slower side — watch the <b>bottleneck</b> tag.</li><li><b>✨ Efficiency</b> makes every item worth more.</li><li>Every <b>⭐ milestone</b> (total Lv 10, 25, 50, 100, 200…) <b>doubles</b> a factory’s output.</li><li>Build new factories for far more valuable products. Each <b>🏆 achievement</b> adds +3% income.</li><li>Tap the factory scene for a quick cash boost. Catch the golden crates that fly across the factory for a 7x income frenzy or a pile of cash. Earn $1M in one run to Franchise: reset for permanent Gold Bars and perks. ★ marks the best-value upgrade.</li></ul><p>Goal: own all '+FACTORIES.length+' factories and earn <b>'+$(EMPIRE_GOAL)+'</b>.</p>',buttons:[{label:'Let’s build! 🔧',fn:()=>{S.helped=true;save()}}]})}
el('helpBtn').onclick=help;
el('resetBtn').onclick=()=>showModal({html:()=>'<div class="big">⚠️</div><h3>Reset everything?</h3><p>All money, factories, upgrades and achievements will be permanently deleted.</p>',
 buttons:[{label:'Cancel',cls:'sec'},{label:'Reset',cls:'red',fn:()=>{resetting=true;try{localStorage.removeItem(SAVE_KEY)}catch(e){}location.reload()}}]});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{tick();updateUI()}});
window.addEventListener('pagehide',save);window.addEventListener('beforeunload',save);

// ================= START =================
buildList();buildHead();buildUpgs();buildAch();resize();
if(L.existed){const el0=(Date.now()-S.lastTick)/1000;S.lastTick=Date.now();if(el0>10)doOffline(el0);else if(el0>0)advance(el0)}
else S.lastTick=Date.now();
if(!S.helped)help();
if(S.taps>=5)el('tapHint').style.opacity=0;
checkAch();updateUI();updateStats();

// ================= FRANCHISE / PERKS =================
let franKey='';
function startFranchise(){
 const g=goldGain();if(g<1)return;
 showModal({html:()=>'<div class="big">🥇</div><h3>Franchise your empire?</h3><p>Your factories and cash reset. You keep achievements and perks, and earn <b>'+fmt(g)+' Gold Bars</b> (+'+fmt(g*5)+'% income forever).</p>',
  buttons:[{label:'Not yet',cls:'sec'},{label:'Franchise!',fn:()=>{
   S.gold+=g;S.goldTotal+=g;S.runs++;S.run=0;S.money=HEAD[perk(4)];S.frenzy=0;S.sel=0;
   S.factories=FACTORIES.map((f,i)=>({built:i===0,lv:[0,0,0,0],items:0,earned:0}));
   sfx.big();save();setTimeout(()=>location.reload(),350)}}]});
}
function buyPerk(k){const c=perkCost(k);if(perk(k)>=PERKS[k].max||S.gold<c){sfx.no();return}
 S.gold-=c;S.perks[k]++;sfx.buy();checkAch();save();updateFran(true)}
function updateFran(force){
 const box=el('fran');if(!box||(!force&&!franVisible()))return;
 const g=goldGain(),key=[S.gold,S.goldTotal,S.perks.join(),g>0,Math.min(S.gold,99999)].join('|');
 if(key!==franKey||force){franKey=key;
  box.innerHTML='<div class="fgold"><div><small>Gold Bars</small><b>'+fmt(S.gold)+'</b></div><div><small>Income bonus</small><b>+'+fmt(S.goldTotal*5)+'%</b></div></div>'
  +'<div class="fbox"><div class="ft">'+(g>0?'Ready to franchise':'Franchise at $1M earned this run')+'</div><div class="bar"><i id="fprog" style="width:0%"></i></div><div class="fs" id="ftxt"></div><button class="build" id="fbtn" '+(g>0?'':'disabled')+'>'+(g>0?'Franchise for +'+fmt(g)+' Gold Bars':'Franchise')+'</button></div>'
  +'<div class="fperks">'+PERKS.map((p,k)=>{const lv=perk(k),mx=lv>=p.max,c=perkCost(k),can=!mx&&S.gold>=c;
   return '<div class="upg perk'+(can?' can':' cant')+'" data-k="'+k+'"><div class="ui">'+p.ic+'</div><div class="ub"><b>'+p.name+'</b><div class="lv">Lv '+lv+' / '+p.max+'</div><small>'+p.desc+'</small></div><div class="cost">'+(mx?'MAX':fmt(c)+' '+'🥇')+'</div></div>'}).join('')+'</div>';
  box.querySelectorAll('.perk').forEach(d=>d.onclick=()=>buyPerk(+d.dataset.k));
  const fb=el('fbtn');if(fb)fb.onclick=startFranchise}
 const pr=Math.min(1,S.run/1e6),fp=el('fprog'),ft=el('ftxt');
 if(fp)fp.style.width=(pr*100)+'%';if(ft)ft.textContent=g>0?('This run: '+$(S.run)+' earned'):($(S.run)+' / $1M this run')}
setInterval(()=>updateFran(false),1000);
updateFran(true);
// ================= GOLDEN CRATES =================
let nextCrate=Date.now()+30000+Math.random()*30000;
function spawnCrate(){
 const w=el('sceneWrap');if(!w||w.offsetParent===null||el('crate'))return;
 const c=document.createElement('div');c.id='crate';c.style.top=(12+Math.random()*30)+'%';
 c.innerHTML='<svg viewBox="0 0 64 64"><defs><linearGradient id="gc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient></defs><rect x="6" y="16" width="52" height="40" rx="7" fill="url(#gc)" stroke="#a86a00" stroke-width="3"/><rect x="28" y="16" width="8" height="40" fill="#ff5a7a"/><rect x="6" y="30" width="52" height="8" fill="#ff5a7a" opacity=".9"/><path d="M32 16c-8-12-20-6-12 0M32 16c8-12 20-6 12 0" fill="none" stroke="#ff5a7a" stroke-width="4" stroke-linecap="round"/></svg>';
 c.addEventListener('animationend',e=>{if(e.animationName==='crateFly')c.remove()});
 const grab=e=>{e.preventDefault();e.stopPropagation();c.remove();catchCrate()};
 c.addEventListener('pointerdown',grab);w.appendChild(c);
}
function catchCrate(){
 S.crates++;const inc=totalIncome(),lk=1+0.2*perk(2),r=Math.random();sfx.big();
 if(r<0.5){S.frenzy=Math.max(S.frenzy,Date.now())+30000;toast('🎁 FRENZY! x7 income for 30s','gold')}
 else{const m=Math.max(25,inc*(r<0.85?150:600)*lk/(Date.now()<S.frenzy?7:1));S.money+=m;S.lifetime+=m;S.run+=m;toast('🎁 Lucky haul! +'+$(m),'gold')}
 try{coinBurst(W/2,140,30)}catch(e){}checkAch();
 nextCrate=Date.now()+(40000+Math.random()*50000)/(1+0.15*perk(2));
}
setInterval(()=>{if(Date.now()>=nextCrate&&!document.hidden){spawnCrate();nextCrate=Date.now()+90000}},1000);

setInterval(tick,100);setInterval(updateUI,250);setInterval(updateStats,1000);setInterval(save,5000);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
